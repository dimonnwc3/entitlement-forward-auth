name: rc-forward-auth-it

services:
  auth:
    build:
      context: ../..
      dockerfile: Dockerfile
    volumes:
      # real config with revenuecat secret key, mounted read-only, never logged
      - ../../config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      PORT: 3000
    networks:
      - proxies

  whoami:
    image: traefik/whoami:v1.10
    networks:
      - proxies

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - auth
      - whoami
    networks:
      - proxies

  traefik:
    image: traefik:v3.5
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "8082:80"
    depends_on:
      - auth
      - whoami
    networks:
      - proxies

  caddy:
    image: caddy:2.10-alpine
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8083:80"
    depends_on:
      - auth
      - whoami
    networks:
      - proxies

networks:
  proxies:
    ipam:
      config:
        - subnet: 172.28.77.0/24
